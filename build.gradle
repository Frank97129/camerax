plugins {
    id 'com.android.library' version '8.2.2'
    id 'maven-publish'
}

group = 'com.github.Frank97129'
version = System.getenv('VERSION') ?: '1.0.0'

android {
    namespace 'com.luck.lib.camerax'
    compileSdk 35

    defaultConfig {
        minSdk 21
        targetSdk 35

        consumerProguardFiles 'consumer-rules.pro'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildFeatures {
        buildConfig = true
    }

    publishing {
        singleVariant('release') {
            withSourcesJar()
        }
    }
}

afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                from components.release
                groupId = project.group
                artifactId = 'camerax'
                version = project.version
            }
        }
    }
}

dependencies {
    def cameraxVersion = '1.4.2'

    api "androidx.camera:camera-core:${cameraxVersion}"
    api "androidx.camera:camera-camera2:${cameraxVersion}"
    api "androidx.camera:camera-view:${cameraxVersion}"
    api "androidx.camera:camera-lifecycle:${cameraxVersion}"
    api "androidx.camera:camera-video:${cameraxVersion}"

    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.transition:transition:1.4.1'
    implementation 'androidx.concurrent:concurrent-futures:1.1.0'
}
